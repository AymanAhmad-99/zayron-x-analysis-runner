version: '3.8'

services:
  telegram-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zayron-telegram-collector
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - telegram_data:/data/telegram
    env_file:
      - .env.collector
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data/telegram
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  telegram_data:
    driver: local
