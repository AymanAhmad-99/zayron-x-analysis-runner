name = "zayron-x-api"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  # PHASE 7D — scoped to /api/v1: everything this worker serves lives there, so
  # /api/og/* (the 1200×630 telemetry cards) now reaches zayron-x-web instead of
  # being answered by this worker's operator auth gate.
  { pattern = "zayron-x.co/api/v1/*", zone_name = "zayron-x.co" },
  { pattern = "www.zayron-x.co/api/v1/*", zone_name = "zayron-x.co" },
  # Wave 4B.2 — dedicated API hostname: the web worker reaches the API over a
  # DISTINCT origin, so a server-side fetch is never a same-zone subrequest to
  # its own hostname (Cloudflare Error 1042). Browser calls stay on
  # https://zayron-x.co/api/v1 (same-origin, no CORS preflight).
  { pattern = "api.zayron-x.co", custom_domain = true }
]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "zayron-x-db"
database_id = "c19c8f45-801b-4034-bd76-402e5e5389b5"
# Gate 1 fix: migrations live at the repo root, so wrangler must be pointed at
# them explicitly. Without this the CLI resolved the nonexistent
# `workers/api/migrations/` and always reported "no migrations to apply".
migrations_dir = "../../db/migrations"

# Canonical malware report store (zayron-x-db.malware_reports) — the EXACT table
# the ZAYRON-X pipeline materializes canonical reports into. Read-only surface
# for the workspace Malware Intelligence view.
[[d1_databases]]
binding = "ZX_DB"
database_name = "zayron-x-db"
database_id = "c19c8f45-801b-4034-bd76-402e5e5389b5"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "zayron-publish-queue"

[[queues.consumers]]
queue = "zayron-publish-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[services]]
binding = "TELEGRAM_COLLECTOR_SERVICE"
service = "zayron-telegram-collector-do"

[[services]]
binding = "INGEST"
service = "zayron-x-ingest"

[[workflows]]
name = "zayron-research-workflow"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"

[[workflows]]
name = "zayron-knowledge-corpus-workflow"
binding = "KNOWLEDGE_CORPUS_WORKFLOW"
class_name = "KnowledgeCorpusWorkflow"

[ai]
binding = "AI"

[env.preview]
name = "zayron-x-api-preview"
workers_dev = true
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zayron-x-preview-db"
database_id = "34962f8f-abd1-4b0b-8bd7-b4eab59bd902"
migrations_dir = "../../db/migrations"

# Preview: the canonical malware-report store is the DEDICATED PREVIEW database.
#
# CONTAINMENT (2026-10-10): this binding previously pointed at the PRODUCTION
# report store, which made the public preview host serve production report
# metadata and full production report bodies. The dedicated preview database
# named below was independently verified to carry the same canonical
# `malware_reports` schema, so the two preview read routes are supported with no
# migration and no change to any route, secret, or application behaviour.
# No production identity appears in this section, by construction.
#
# `scripts/preview-target-guard.mjs` fails closed on the production identity
# here: this binding may only be absent or the approved preview database.
[[env.preview.d1_databases]]
binding = "ZX_DB"
database_name = "zayron-x-preview-db"
database_id = "34962f8f-abd1-4b0b-8bd7-b4eab59bd902"

# Required secrets (set out-of-band, never committed):
#   ADMIN_API_TOKEN          - operator/admin bearer token (required for /admin/* and operator mutations)
#   KNOWLEDGE_INTERNAL_TOKEN - internal service token (already required by /rag/*)
#   TELEGRAM_WEBHOOK_SECRET  - Telegram webhook secret; endpoint fails closed (503) when unset
#   GEMINI_API_KEY           - Gemini API fallback key (Preview secret only)
[[env.preview.ratelimits]]
name = "API_LIMITER_FREE"
namespace_id = "71011"
simple = { limit = 30, period = 60 }

[[env.preview.ratelimits]]
name = "API_LIMITER_PRO"
namespace_id = "71012"
simple = { limit = 300, period = 60 }

[[env.preview.ratelimits]]
name = "API_LIMITER_ENTERPRISE"
namespace_id = "71013"
simple = { limit = 1200, period = 60 }

[env.preview.vars]
ENVIRONMENT = "preview"
LEGACY_FREEZE = "false"
FREE_TIER_MODE = "true"
ALLOWED_ORIGINS = "https://zayron-x.co,https://www.zayron-x.co,https://zayron-x-web-preview.aabusabih.workers.dev,http://localhost:8799,http://127.0.0.1:8799,http://localhost:8801,http://127.0.0.1:8801"
TELEGRAM_TARGET_CHANNEL = "zayronxai"
# Gate 2C — declared explicitly so preview is not silently dependent on the
# 14400s production default in edgeCache.ts. Short TTL keeps preview iteration
# snappy and its D1 read budget small.
PUBLIC_EDGE_CACHE_TTL_SECONDS = "300"

# Effective Preview INTELLIGENCE-SUPPLY destination, declared as configuration
# ("<database_name>:<database_id>") rather than inferred from the environment
# name. The Preview supply path resolves this value at runtime and fails closed
# on missing/malformed/conflicting input, and
# `scripts/preview-target-guard.mjs` refuses any deploy where it disagrees with
# the `[env.preview].DB` binding or names the production database.
PREVIEW_SUPPLY_DB_IDENTITY = "zayron-x-preview-db:34962f8f-abd1-4b0b-8bd7-b4eab59bd902"

[env.preview.ai]
binding = "AI"

[[env.preview.services]]
binding = "INGEST"
service = "zayron-x-ingest-preview"

[[env.preview.services]]
binding = "TELEGRAM_COLLECTOR_SERVICE"
service = "zayron-telegram-collector-do-preview"

# ═══════════════════════════════════════════════════════════════
# PREVIEW QUEUE PRODUCER BINDING
# Required for env.INGEST_QUEUE.metrics() to resolve realtime
# queue telemetry in the health endpoint.
# PREVIEW ONLY — does NOT touch the production queue.
# ═══════════════════════════════════════════════════════════════
[[env.preview.queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue-preview"

# Gate 2C — PREVIEW ISOLATION. The publish queue is a DEDICATED preview queue.
# Binding the production `zayron-publish-queue` here would let the preview worker
# consume (and ack or discard) real production publish messages.
[[env.preview.queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "zayron-publish-queue-preview"

[[env.preview.queues.consumers]]
queue = "zayron-publish-queue-preview"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Gate 2C — PREVIEW ISOLATION. Dedicated bucket; never `zayron-x-knowledge`,
# which is the production corpus store.
[[env.preview.r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "zayron-x-knowledge-preview"

# Gate 2C — PREVIEW ISOLATION. Workflow names are account-scoped, so binding
# `zayron-research-workflow` / `zayron-knowledge-corpus-workflow` here would
# attach the preview script to the PRODUCTION workflow definitions and their
# instances. Preview gets its own `-preview` named workflows.
[[env.preview.workflows]]
name = "zayron-research-workflow-preview"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"

[[env.preview.workflows]]
name = "zayron-knowledge-corpus-workflow-preview"
binding = "KNOWLEDGE_CORPUS_WORKFLOW"
class_name = "KnowledgeCorpusWorkflow"

[[env.preview.vectorize]]
binding = "VECTORIZE"
index_name = "zayron-doc04-staging-index"

[[vectorize]]
binding = "VECTORIZE"
index_name = "zayron-knowledge-index"

[[r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "zayron-x-knowledge"

# Wave 4A — the outbound Telegram channel was previously resolved only by
# the hardcoded 'zayronxai' fallback in publishApprovedIntelligence(), because
# this variable was never declared for this worker. Declared here so the
# channel is configuration, not a literal buried in code.
# ═══════════════════════════════════════════════════════════════
# PHASE 7A — NATIVE WORKERS RATE-LIMIT BINDINGS (Free-Tier Shield)
#
# Counters live in the Cloudflare edge, so a rejected request never reaches D1.
# `period` may only be 10 or 60 seconds. `namespace_id` is an account-unique
# integer identifying the counter namespace (it is NOT a KV/D1 resource and
# requires no provisioning). Preview deliberately uses different namespace ids
# so a preview test can never consume production allowance.
# ═══════════════════════════════════════════════════════════════
[[ratelimits]]
name = "API_LIMITER_FREE"
namespace_id = "71001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "API_LIMITER_PRO"
namespace_id = "71002"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "API_LIMITER_ENTERPRISE"
namespace_id = "71003"
simple = { limit = 1200, period = 60 }

[vars]
ENVIRONMENT = "production"
TELEGRAM_TARGET_CHANNEL = "zayronxai"
LEGACY_FREEZE = "true"
# Architectural flag: keeps every choice inside Free-tier caps while remaining
# upgrade-ready. Flipping it to "false" after the Workers Paid upgrade is the
# only change needed to lift the protective TTLs.
FREE_TIER_MODE = "true"
ALLOWED_ORIGINS = "https://zayron-x.co,https://www.zayron-x.co"
# PHASE 7A contract: public reads are served from the edge cache for 300s.
# This is the `s-maxage` the CDN advertises on every public catalog response;
# the 600s stale-while-revalidate window is emitted by `jsonResponse()`.
# Overridable per environment without a code change; absent/invalid falls back
# to the 14400s Free-tier default in edgeCache.ts.
PUBLIC_EDGE_CACHE_TTL_SECONDS = "300"
# Cache generation. Bump it whenever a release changes the SHAPE or MEANING of a
# cached public record (schema migration, re-enrichment, brief contract), so the
# new payload is served immediately instead of after the TTL above.
PUBLIC_EDGE_CACHE_EPOCH = "api-v1-2026-11-28a"

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL DEAD-LETTER QUEUE (env.DLQ)
#
# The queue consumer already guards the forward with `if (env.DLQ)` and records
# a DISCARDED tombstone in `event_trace`, so no binding is required to deploy.
# To actually park exhausted messages, CREATE the queue first and THEN add the
# binding below (binding an unprovisioned queue fails `wrangler deploy`):
#
#   npx wrangler queues create zayron-publish-dlq
#   npx wrangler queues create zayron-publish-dlq-preview
#
# then uncomment:
#
# [[queues.producers]]
# binding = "DLQ"
# queue = "zayron-publish-dlq"
#
# and inside [env.preview]:
#
# [[env.preview.queues.producers]]
# binding = "DLQ"
# queue = "zayron-publish-dlq-preview"
# ─────────────────────────────────────────────────────────────────────────────

# ZX-28: Workers Logs / traces. Enables structured invocation logs and error
# traces without touching CPU limits (a 200ms cap would throttle AI analysis).
[observability]
enabled = true

# Gate 2C — preview observability parity (Wrangler does not inherit the
# top-level block into a named environment).
[env.preview.observability]
enabled = true
