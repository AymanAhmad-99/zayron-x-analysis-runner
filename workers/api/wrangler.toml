name = "zayron-x-api"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zayron-x-db"
database_id = "c19c8f45-801b-4034-bd76-402e5e5389b5"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "zayron-knowledge-index"

[vars]
ENVIRONMENT = "production"

routes = [
  { pattern = "zayron-x.co/api/*", zone_name = "zayron-x.co" },
  { pattern = "www.zayron-x.co/api/*", zone_name = "zayron-x.co" }
]
