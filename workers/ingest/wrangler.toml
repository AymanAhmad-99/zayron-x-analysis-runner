name = "zayron-x-ingest"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zayron-x-db"
database_id = "c19c8f45-801b-4034-bd76-402e5e5389b5"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue"

[[queues.consumers]]
queue = "zayron-ingest-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "zayron-publish-queue"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "zayron-knowledge-index"

[[r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "zayron-x-knowledge"

[[services]]
binding = "TELEGRAM_COLLECTOR_SERVICE"
service = "zayron-telegram-collector-do"

# Phase 4A — the strategic engine runs in the worker that owns the model
# credential. A service binding is internal-only (no HTTP surface), and the
# engine itself enforces eligibility, idempotency and the daily budget, so a
# missing `GEMINI_API_KEY` degrades to the documented clean skip.
[[services]]
binding = "STRATEGIC_ANALYST"
service = "zayron-x-api"
entrypoint = "StrategicCveAnalyst"

[[services]]
binding = "KNOWLEDGE_PROCESSOR"
service = "zayron-x-api"
entrypoint = "KnowledgeProcessor"

[[workflows]]
name = "zayron-research-workflow"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"
script_name = "zayron-x-api"

[[workflows]]
name = "zayron-knowledge-corpus-workflow"
binding = "KNOWLEDGE_CORPUS_WORKFLOW"
class_name = "KnowledgeCorpusWorkflow"
script_name = "zayron-x-api"

[vars]
ENVIRONMENT = "production"
TELEGRAM_TARGET_CHANNEL = "zayronxai"
LEGACY_FREEZE = "true"
# Phase 4A — SELECTIVE UNFREEZE. This opens ONLY the authoritative
# NVD + CISA KEV + FIRST EPSS pulse (and its bounded strategic layer) from
# `scheduled()`. Every legacy path stays closed because the freeze branch
# returns before the RSS/KEV/MSRC enqueues, the AI smoke test and any outbound
# work. Absent or any other value leaves the pulse disabled.
AUTHORITATIVE_CVE_CRON_ENABLED = "true"
# Phase 4C.2 — EXECUTIVE TELEGRAM WIRE IS OPEN. Publishing to a public channel
# is a live, unrecallable action, so it opens only on an explicit operator
# decision: the Phase 4C.2 ruling, with TELEGRAM_BOT_TOKEN provisioned as a
# Worker Secret and the bot added as an admin of @zayronxai. Preview stays
# closed (dry run only). The cap is a hard ceiling (dispatcher clamps to 1..6).
TELEGRAM_OUTBOUND_ENABLED = "true"
TELEGRAM_MAX_DAILY_DISPATCHES = "6"
# Phase 4C.3 — ANTI-BURST PACING. The cron is `0 */4 * * *` (6 ticks/day), so the
# daily cap alone still allowed a single tick to publish the whole backlog at
# once (04:07 UTC shipped three posts in one second). One post per tick, plus a
# 180-minute minimum spacing between automated posts, makes a burst structurally
# impossible. `/internal/telegram-dispatch` is exempt: an explicit operator
# invocation is the authorised override, still bounded by the 6/day cap.
TELEGRAM_MAX_PER_TICK = "1"

[env.preview]
name = "zayron-x-ingest-preview"
workers_dev = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zayron-x-preview-db"
database_id = "34962f8f-abd1-4b0b-8bd7-b4eab59bd902"

[[env.preview.queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue-preview"

[[env.preview.queues.consumers]]
queue = "zayron-ingest-queue-preview"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Gate 2C — PREVIEW ISOLATION. The production producer binding would enqueue
# real publish jobs from preview runs into the production queue.
[[env.preview.queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "zayron-publish-queue-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
TELEGRAM_TARGET_CHANNEL = "zayronxai"
LEGACY_FREEZE = "false"
AUTHORITATIVE_CVE_CRON_ENABLED = "true"
# Preview must never publish to the production channel: dry run only.
TELEGRAM_OUTBOUND_ENABLED = "false"
TELEGRAM_MAX_DAILY_DISPATCHES = "6"
TELEGRAM_MAX_PER_TICK = "1"

[[env.preview.vectorize]]
binding = "VECTORIZE"
index_name = "zayron-doc04-staging-index"

# Gate 2C — PREVIEW ISOLATION. Production writes corpus artifacts to
# `zayron-x-knowledge`; preview must never overwrite them.
[[env.preview.r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "zayron-x-knowledge-preview"

# Gate 2C — PREVIEW ISOLATION. Distinct workflow names; the classes live in the
# preview API script, matching the production `script_name` arrangement.
[[env.preview.workflows]]
name = "zayron-research-workflow-preview"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"
script_name = "zayron-x-api-preview"

[[env.preview.workflows]]
name = "zayron-knowledge-corpus-workflow-preview"
binding = "KNOWLEDGE_CORPUS_WORKFLOW"
class_name = "KnowledgeCorpusWorkflow"
script_name = "zayron-x-api-preview"

[[env.preview.services]]
binding = "TELEGRAM_COLLECTOR_SERVICE"
service = "zayron-telegram-collector-do-preview"

[[env.preview.services]]
binding = "KNOWLEDGE_PROCESSOR"
service = "zayron-x-api-preview"
entrypoint = "KnowledgeProcessor"

# Preview-only internal RPC to the EXISTING analyst-grade CVE pipeline.
# Absent from the top-level (production) config by design, so continuous
# ingestion AI dispatch is inert in production.
[[env.preview.services]]
binding = "VULNERABILITY_ANALYST"
service = "zayron-x-api-preview"
entrypoint = "VulnerabilityAnalyst"

# Phase 4A — the strategic-brief engine lives where the model credential is
# provisioned (the API Preview worker). The cron dispatches into it instead of
# duplicating a second AI path. Production has no such binding: the in-worker
# engine then performs the documented MISSING_CREDENTIAL clean skip.
[[env.preview.services]]
binding = "STRATEGIC_ANALYST"
service = "zayron-x-api-preview"
entrypoint = "StrategicCveAnalyst"

[env.preview.ai]
binding = "AI"

[env.preview.triggers]
# Free-Tier Survival Mode: the preview loop is dormant, so its 144 daily runs
# burned D1 row reads/writes for data nobody reads. Restore a cadence only if a
# preview actually needs to ingest.
crons = []

# Production scheduling (ZX-08): the preview environment was the ONLY one
# with a cron trigger, so the deployed production ingestion loop was inert.
# The trigger is inert while LEGACY_FREEZE=true (production vars) — the freeze is
# the deliberate kill-switch, not a missing schedule.
#
# ZX-33 Free-Tier Survival Mode: `*/10` meant 144 runs/day, each paying D1 reads
# and writes against a 100k-write/day budget. Every 4 hours is 6 runs/day (96%
# less burn) and still keeps the corpus fresh while the corpus is bootstrapping.
# Phase 4A — the schedule must live on the TOP-LEVEL worker (`zayron-x-ingest`),
# which is what `wrangler deploy` actually publishes. It previously sat in
# `[env.production.triggers]`, i.e. on a DIFFERENT (never deployed) worker, so
# the live production loop had no cron at all and no amount of unfreezing could
# have produced a pulse.
#
# Free-Tier Survival Mode (every 4h); restore */10 or */30 after a Workers Paid
# upgrade. Under LEGACY_FREEZE=true this fires ONLY the authoritative pulse.
[triggers]
crons = ["0 */4 * * *"]

# ZX-28: Workers Logs / traces for queue and cron invocations. CPU limits are
# deliberately untouched: a cap would throttle AI/ingest workloads.
[observability]
enabled = true

# Gate 2C — preview observability parity.
[env.preview.observability]
enabled = true
