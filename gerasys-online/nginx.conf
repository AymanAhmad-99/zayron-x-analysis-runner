# ============================================
# ZAYRON SECURITY — Nginx Configuration
# ============================================

upstream zayron_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name zayron-x.com www.zayron-x.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zayron-x.com;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zayron-x.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayron-x.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Proxy to Next.js
    location / {
        proxy_pass http://zayron_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets — aggressive caching
    location /_next/static {
        proxy_pass http://zayron_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static {
        proxy_pass http://zayron_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Robots
    location = /robots.txt {
        proxy_pass http://zayron_upstream;
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://zayron_upstream;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ /\.env {
        deny all;
    }
    location ~ /node_modules {
        deny all;
    }

    # Large client body for API
    client_max_body_size 10M;
}
