# Fixture: a well-formed PREVIEW-ONLY ingest target.
#
# Shape mirrors the real `workers/ingest/wrangler.toml` [env.preview] section:
# preview worker name, preview D1, preview queue (producer AND consumer) and the
# preview vars the entrypoint asserts. Used to prove the guard ACCEPTS a correct
# target, so the refusal tests beside it are meaningful.

name = "zayron-x-ingest"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "zayron-x-db"
database_id = "c19c8f45-801b-4034-bd76-402e5e5389b5"

[env.preview]
name = "zayron-x-ingest-preview"
workers_dev = true
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zayron-x-preview-db"
database_id = "34962f8f-abd1-4b0b-8bd7-b4eab59bd902"

[[env.preview.queues.producers]]
binding = "INGEST_QUEUE"
queue = "zayron-ingest-queue-preview"

[[env.preview.queues.consumers]]
queue = "zayron-ingest-queue-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
LEGACY_FREEZE = "false"

[env.preview.triggers]
# Wave 4C: the preview ingest loop is dormant (Free-Tier Survival Mode).
crons = []
