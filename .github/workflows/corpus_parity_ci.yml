name: Corpus Parity and Pipeline Integrity CI

on:
  push:
    branches: [ main, master, cleanup/forensic-production-simplification ]
  pull_request:
    branches: [ main, master ]

# ZX-02: least privilege at workflow scope. No credential is declared at
# workflow level; the Cloudflare token is attached to one push-only step.
permissions:
  contents: read

# Wave 4A — one verification run per ref; a newer push supersedes an
# in-flight run for the same ref instead of stacking duplicate work.
concurrency:
  group: corpus-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-corpus-parity:
    name: Verify D1 / Vectorize Corpus Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.1.7 - immutable SHA
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 - immutable SHA
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Pipeline Integrity Tests
        run: bun test tests/corpus_pipeline_integrity.test.ts

      - name: Run Multi-Document Scale Test
        run: bun test tests/corpus_scale_test.test.ts

      # ZX-02: remote parity needs the Cloudflare credential, so it must be
      # unreachable from pull_request runs (untrusted head code): push-only,
      # release-branch-only.
      - name: Verify Corpus Parity
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: bun run verify --manifest corpus_manifest.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ZX-15: TypeScript zero-error gate. Runs on every push and pull_request with
  # read-only contents access and no secrets — no Cloudflare credential is needed.
  typecheck:
    name: TypeScript Zero-Error Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.1.7 - immutable SHA
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 - immutable SHA
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Workspace
        run: bunx tsc --noEmit -p tsconfig.json

      # ZX-32: every Worker must pin the same compatibility date and flag set.
      # Drift here changes runtime behaviour silently, so it fails the build.
      - name: Check Worker Compatibility Consistency
        run: node tools/check-worker-compatibility.mjs
