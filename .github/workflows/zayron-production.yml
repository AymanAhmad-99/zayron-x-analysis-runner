name: "ZAYRON-X - Production Deployment"

on:
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.13"
  WORKER_ENV: "production"
  WORKER_NAME: "zayron-x"

jobs:
  validate-and-deploy:
    name: Validate, deploy, and monitor production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gerasys-online

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome linter
        run: bun run lint

      - name: Run type check
        run: bun run type-check

      - name: Run unit tests
        run: bun run test:unit

      - name: Build platform
        run: bunx --bun opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "zayron-x"
          SENTRY_PROJECT: "zayron-x-web"

      - name: Patch node:fs internals
        run: node scripts/patch-handler-fs.cjs

      - name: Verify bundle cleanliness
        run: bash scripts/verify-worker-build.sh

      - name: Print deployment mapping
        run: |
          echo "Deployment mapping"
          echo "  Environment: ${{ env.WORKER_ENV }}"
          echo "  Worker:      ${{ env.WORKER_NAME }}"
          echo "  Commit SHA:  ${{ github.sha }}"
          echo ""
          echo "Custom domain cutover is separate from this deploy."

      - name: Deploy production worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env ${{ env.WORKER_ENV }}
          workingDirectory: gerasys-online

      - name: Execute canary health monitoring
        id: canary-check
        run: |
          bash scripts/canary-health-check.sh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "zayron-x"
          SENTRY_PROJECT: "zayron-x-web"
          ERROR_THRESHOLD_PCT: "1.0"
          POLL_INTERVAL_SEC: "30"
          MAX_POLLS: "10"
          CANARY_DURATION_MIN: "5"
          STRICT_CANARY: "true"

      - name: Automated rollback on canary failure
        if: failure() && steps.canary-check.outcome == 'failure'
        run: |
          echo "Canary check failed. Reverting production deployment..."
          bash scripts/rollback.sh --env ${{ env.WORKER_ENV }} --yes
          echo "Deployment rolled back successfully due to errors."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Confirm successful production deployment
        if: success()
        run: |
          echo "=========================================="
          echo "ZAYRON-X production deployment successful"
          echo "=========================================="
          echo "Environment:  ${{ env.WORKER_ENV }}"
          echo "Worker:       ${{ env.WORKER_NAME }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit SHA:   ${{ github.sha }}"
          echo "zayron-x.com stays on Wix until DNS/routes are moved."
          echo "=========================================="
