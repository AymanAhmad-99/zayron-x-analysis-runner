name: "ZAYRON-X - Manual Preview Deployment"

on:
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.13"
  WORKER_ENV: "preview"
  WORKER_NAME: "zayron-x-preview"

jobs:
  validate-and-deploy:
    name: Validate and deploy preview manually
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gerasys-online

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome linter
        run: bun run lint

      - name: Run type check
        run: bun run type-check

      - name: Run unit tests
        run: bun run test:unit

      - name: Build platform
        run: bunx --bun opennextjs-cloudflare build

      - name: Patch node:fs internals
        run: node scripts/patch-handler-fs.cjs

      - name: Verify bundle cleanliness
        run: bash scripts/verify-worker-build.sh

      - name: Print deployment mapping
        run: |
          echo "Deployment mapping"
          echo "  Environment: ${{ env.WORKER_ENV }}"
          echo "  Worker:      ${{ env.WORKER_NAME }}"
          echo "  Commit SHA:  ${{ github.sha }}"
          echo ""
          echo "Use the exact workers.dev or preview URL printed by Wrangler below."

      - name: Deploy preview worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env ${{ env.WORKER_ENV }}
          workingDirectory: gerasys-online

      - name: Confirm successful preview deployment
        if: success()
        run: |
          echo "=========================================="
          echo "ZAYRON-X manual preview deployment successful"
          echo "=========================================="
          echo "Environment:  ${{ env.WORKER_ENV }}"
          echo "Worker:       ${{ env.WORKER_NAME }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit SHA:   ${{ github.sha }}"
          echo "Open the exact Wrangler URL from the deploy logs above."
          echo "=========================================="
