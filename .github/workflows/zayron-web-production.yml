name: "ZAYRON-X Web - Production Deployment"

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - '.github/workflows/zayron-web-production.yml'
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.13"
  WORKER_ENV: "production"
  WORKER_NAME: "zayron-x-web"

jobs:
  validate-and-deploy:
    name: Validate, build, and deploy canonical frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make governance scripts executable
        run: chmod +x .zayron/scripts/*.sh

      - name: Run Governance Gates
        run: |
          ./.zayron/scripts/project-forensics.sh
          ./.zayron/scripts/project-reconcile.sh
          ./.zayron/scripts/secret-scan.sh
          ./.zayron/scripts/architecture-drift-check.sh
          ./.zayron/scripts/legacy-drift-check.sh
          ./.zayron/scripts/governance-check.sh

      - name: Run Biome linter
        run: bun run lint
        working-directory: apps/web

      - name: Run type check
        run: bun run tsc --noEmit
        working-directory: apps/web

      - name: Build Next.js & OpenNext
        run: bun run build:cf
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "zayron-x"
          SENTRY_PROJECT: "zayron-x-web"

      - name: Stale Artifact Guard
        working-directory: apps/web
        run: |
          echo "Checking artifact timestamps..."
          NEXT_TIME=$(stat -c %Y .next/build-manifest.json 2>/dev/null || echo 0)
          OPENNEXT_TIME=$(stat -c %Y .open-next/worker.js 2>/dev/null || echo 0)
          
          if [ "$NEXT_TIME" -eq 0 ] || [ "$OPENNEXT_TIME" -eq 0 ]; then
            echo "ERROR: Missing build artifacts."
            exit 1
          fi

          if [ "$OPENNEXT_TIME" -lt "$NEXT_TIME" ]; then
            echo "ERROR: OpenNext build is older than Next.js build. Stale artifact detected."
            exit 1
          fi
          echo "Artifact timestamps are valid."

      - name: Visual Fingerprint Validation
        working-directory: apps/web
        run: |
          echo "Validating against VISUAL_DESIGN_FINGERPRINT.json..."
          if grep -q "zayron-x-terminal" .open-next/assets/chunks/*.js 2>/dev/null; then
            echo "ERROR: Legacy terminal UI marker found in built output!"
            exit 1
          fi
          if ! grep -q "Understand what changed" .open-next/worker.js; then
            echo "ERROR: Expected canonical markers not found in built output!"
            exit 1
          fi
          echo "Visual fingerprint validation passed."

      - name: Bundle Size Limits
        working-directory: apps/web
        run: |
          WORKER_SIZE=$(stat -c%s ".open-next/worker.js" 2>/dev/null || echo 0)
          GZIP_SIZE=$(gzip -c .open-next/worker.js | wc -c)
          MAX_SIZE=5242880 # 5MB limit
          
          echo "Worker bundle size: $WORKER_SIZE bytes"
          echo "Gzipped size: $GZIP_SIZE bytes"
          
          if [ "$WORKER_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Bundle size exceeds 5MB limit!"
            exit 1
          fi

      - name: Verify D1 Binding Config
        working-directory: apps/web
        run: |
          if ! grep -q "zayron-x-db" wrangler.toml; then
            echo "ERROR: D1 database binding missing from wrangler.toml"
            exit 1
          fi

      - name: Deploy canonical production worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env ${{ env.WORKER_ENV }}
          workingDirectory: apps/web

      - name: Confirm successful deployment
        if: success()
        run: |
          echo "=========================================="
          echo "ZAYRON-X CANONICAL FRONTEND DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo "Environment:  ${{ env.WORKER_ENV }}"
          echo "Worker:       ${{ env.WORKER_NAME }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit SHA:   ${{ github.sha }}"
          echo "Domain:       https://zayron-x.co"
          echo "=========================================="
