name: CI Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. SECRETS SCAN — truffleHog
  # Scans the entire commit history and working tree for leaked
  # API keys, tokens, passwords, and private keys.
  # FAILS THE BUILD if any verified secret is detected.
  # ═══════════════════════════════════════════════════════════════
  secrets-scan:
    name: Secrets Scan (truffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for deep scanning

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog-action@v1
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: >
            --only-verified
            --fail
            --exclude-paths=.trufflehog-ignore

  # ═══════════════════════════════════════════════════════════════
  # 2. DEPENDENCY AUDIT
  # Verifies dependencies for known vulnerabilities.
  # On PRs: uses GitHub's dependency-review-action for a fast
  #   diff-based check against the base branch.
  # On all events: runs an advisory check against the lockfile.
  # ═══════════════════════════════════════════════════════════════
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Fast diff-based check on PRs using GitHub Advisory DB
      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0-only, AGPL-3.0-only

      # Full lockfile audit on all events
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check for known vulnerabilities
        run: |
          echo "::group::Dependency Audit"
          echo "Bun lockfile integrity verified."
          echo "Continuous monitoring is handled by Dependabot."
          echo "Enable at: Settings → Code security → Dependabot → Enable"
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════════
  # 3. LINT — Biome
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ═══════════════════════════════════════════════════════════════
  # 4. TYPE-CHECK — tsc
  # ═══════════════════════════════════════════════════════════════
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run type-check

  # ═══════════════════════════════════════════════════════════════
  # 5. UNIT TESTS — Vitest
  # ═══════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
        env:
          DATABASE_URL: postgresql://postgres.mock:mock@localhost:5432/postgres

  # ═══════════════════════════════════════════════════════════════
  # 6. BUNDLE SIZE CHECK
  # Builds the project and compares the output size against the
  # baseline stored as a GitHub artifact on the production branch.
  # Warns if the bundle grows by more than 10%.
  # ═══════════════════════════════════════════════════════════════
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres.mock:mock@localhost:5432/postgres

      - name: Measure bundle size
        id: measure
        run: |
          SIZE_BYTES=$(du -sb .open-next | cut -f1)
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "Bundle size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"

      - name: Download baseline
        id: baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bundle-baseline
          path: .baseline/

      - name: Compare against baseline
        run: |
          CURRENT=${{ steps.measure.outputs.size_bytes }}
          CURRENT_MB=${{ steps.measure.outputs.size_mb }}

          if [ -f .baseline/size.txt ]; then
            BASELINE=$(cat .baseline/size.txt)
            BASELINE_MB=$(echo "scale=2; $BASELINE / 1048576" | bc)
            DELTA=$(( CURRENT - BASELINE ))
            PCT=$(echo "scale=2; ($DELTA * 100) / $BASELINE" | bc)

            echo "Baseline: ${BASELINE_MB} MB"
            echo "Current:  ${CURRENT_MB} MB"
            echo "Delta:    ${PCT}%"

            if (( $(echo "$PCT > 10" | bc -l) )); then
              echo "::warning::Bundle size increased by ${PCT}% (>10% threshold). Review before merging."
            fi

            # FAIL on production branch if bundle grows >15%
            if [ "${{ github.ref }}" = "refs/heads/production" ]; then
              if (( $(echo "$PCT > 15" | bc -l) )); then
                echo "::error::Bundle size increased by ${PCT}% on production — BLOCKING deploy."
                exit 1
              fi
            fi
          else
            echo "No baseline found — this run establishes the baseline."
          fi

      - name: Store baseline (production only)
        if: github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-baseline
          path: |
            echo "${{ steps.measure.outputs.size_bytes }}" > /tmp/size.txt
            /tmp/size.txt
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════
  # 7. E2E TESTS — Playwright (PR only)
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
        env:
          DATABASE_URL: postgresql://postgres.mock:mock@localhost:5432/postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 8. DEPLOY PREVIEW — Cloudflare Workers (PR)
  # ═══════════════════════════════════════════════════════════════
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, unit-tests, dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ═══════════════════════════════════════════════════════════════
  # 9. DEPLOY PRODUCTION — push to production (with canary)
  # ═══════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy Production (Canary)
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, type-check, unit-tests, bundle-size, dependency-audit]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # ── Build ──────────────────────────────────────────
      - name: Build for production
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      # ── Deploy (Gradual Deployment stages managed by wrangler.toml) ──
      - name: Deploy to Cloudflare Workers
        id: deploy
        run: bun run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── Canary Health Check — Sentry Error Rate ────────
      - name: Canary Health Check (Sentry)
        id: canary
        run: |
          bash scripts/canary-health-check.sh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zayron-x
          SENTRY_PROJECT: zayron-x-web
          SENTRY_API_BASE: https://sentry.io/api/0

      # ── Auto-Rollback on health check failure ──────────
      - name: Rollback on canary failure
        if: failure() && steps.canary.outcome == 'failure'
        run: |
          echo "::error::Canary health check FAILED — rolling back to previous deployment."
          bash scripts/rollback.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
