# ═══════════════════════════════════════════════════════════════
# 🛡️ ZAYRON‑X — Edge Deployment Pipeline
# ─────────────────────────────────────────────────────────────
# نظام النشر التلقائي لمنصة ZAYRON‑X على حافة Cloudflare
# يعمل عند كل push على فرع production أو عند التشغيل اليدوي
# ═══════════════════════════════════════════════════════════════

name: "🛡️ ZAYRON‑X — Edge Deployment"

on:
  # ── يعمل تلقائياً عند push على فرع الإنتاج ──
  push:
    branches:
      - production

  # ── يمكن تشغيله يدوياً من واجهة GitHub Actions ──
  workflow_dispatch:

# ── متغيرات البيئة العامة ──
env:
  BUN_VERSION: "1.3.13"           # إصدار Bun المستخدم في المشروع
  WORKER_ENV: "preview"      # بيئة النشر: preview أو production

jobs:
  build-and-deploy:
    name: 🏗️ بناء ونشر المنصة
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gerasys-online   # المشروع داخل مجلد فرعي

    steps:
      # ── الخطوة 1: سحب الكود المصدري ──
      - name: 📥 سحب الكود المصدري
        uses: actions/checkout@v4

      # ── الخطوة 2: تثبيت Bun مباشرة ──
      - name: ⚡ Install Bun (direct)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      # ── الخطوة 3: تثبيت الحزم والاعتماديات ──
      - name: 📦 تثبيت الاعتماديات
        run: bun install --frozen-lockfile

      # ── الخطوة 4: بناء المشروع عبر OpenNext ──
      - name: 🔨 بناء المنصة (OpenNext → Cloudflare)
        run: bunx --bun opennextjs-cloudflare build

      # ── الخطوة 4.5: إزالة استدعاءات node:fs من Next.js internals ──
      - name: 🔧 إصلاح node:fs (Post‑Build Polyfill Injection)
        run: node scripts/patch-handler-fs.cjs

      # ── الخطوة 4.6: التحقق من خلو الحزمة من node:fs ──
      - name: ✅ التحقق من خلو الحزمة من node:fs
        run: |
          if grep -rq "node:fs" .open-next/server-functions/ .open-next/middleware/ 2>/dev/null; then
            echo "❌ فشل: لا تزال هناك استدعاءات node:fs في الحزمة!"
            grep -rn "node:fs" .open-next/server-functions/ .open-next/middleware/ 2>/dev/null || true
            exit 1
          fi
          if grep -rq 'require("fs")' .open-next/server-functions/ .open-next/middleware/ 2>/dev/null; then
            echo "❌ فشل: لا تزال هناك استدعاءات require(\"fs\") في الحزمة!"
            grep -rn 'require("fs")' .open-next/server-functions/ .open-next/middleware/ 2>/dev/null || true
            exit 1
          fi
          echo "✅ لا توجد أي استدعاءات node:fs أو fs في الحزمة النهائية!"

      # ── الخطوة 5: نشر على Cloudflare Workers ──
      - name: 🚀 نشر على حافة Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env ${{ env.WORKER_ENV }}
          workingDirectory: gerasys-online

      # ── رسالة النجاح ──
      - name: ✅ تأكيد نجاح النشر
        if: success()
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "🛡️  ZAYRON‑X — تم النشر بنجاح!"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📌 البيئة:  ${{ env.WORKER_ENV }}"
          echo "📦 الفرع:   ${{ github.ref_name }}"
          echo "🔖 الكوميت: ${{ github.sha }}"
          echo ""
          echo "🌐 رابط المعاينة:"
          echo "   https://zayron-x-preview.workers.dev"
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✅ المنصة تعمل الآن على حافة Cloudflare العالمية"
          echo "═══════════════════════════════════════════════════════"
