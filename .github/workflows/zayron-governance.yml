name: "ZAYRON-X Governance Check"

on:
  push:
    branches:
      - production
      - main
  pull_request:
    branches:
      - production
      - main
  workflow_dispatch:

jobs:
  governance-validation:
    name: Repository Governance & Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .zayron/scripts/*.sh

      - name: Project Forensics Scanner
        run: .zayron/scripts/project-forensics.sh

      - name: Project Reconciliation Engine
        run: .zayron/scripts/project-reconcile.sh

      - name: Secret Scan
        run: .zayron/scripts/secret-scan.sh

      - name: Architecture Drift Check
        run: .zayron/scripts/architecture-drift-check.sh

      - name: Legacy Drift Check
        run: .zayron/scripts/legacy-drift-check.sh

      - name: Governance Core Check
        run: .zayron/scripts/governance-check.sh

      - name: Visual Fingerprint Verification
        run: |
          if [ ! -f .zayron/controls/VISUAL_DESIGN_FINGERPRINT.json ]; then
            echo "BLOCKED: VISUAL_DESIGN_FINGERPRINT.json missing"
            exit 1
          fi
          echo "PASS"
